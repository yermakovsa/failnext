name: ci

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true

      - name: gofmt check
        run: |
          bad=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$bad" ]; then
            echo "gofmt needed on:"
            echo "$bad"
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy

      - name: go mod tidy check
        run: |
          git diff --exit-code -- go.mod go.sum
          test -z "$(git ls-files --others --exclude-standard -- go.mod go.sum)"

      - name: go vet
        env:
          GOFLAGS: -mod=readonly
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        env:
          GOFLAGS: -mod=readonly
        with:
          version: "2026.2"
          install-go: false

  test-minimum:
    name: test / Go 1.24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go 1.24
        uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: true

      - name: go test
        run: go test ./... -count=1

  test-current:
    name: test / Go 1.27
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true

      - name: go test
        run: go test ./... -count=1

  race:
    name: race / Go 1.27
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true

      - name: go test -race
        run: go test -race ./... -count=1

  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: examples/goethereum/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Scan failnext
        env:
          GOFLAGS: -mod=readonly
        run: govulncheck ./...

      - name: Scan go-ethereum examples
        working-directory: examples/goethereum
        env:
          GOFLAGS: -mod=readonly
        run: govulncheck ./...